<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastExpress – Cotizador de envíos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="marca">
    <span class="logo" aria-hidden="true"></span>
    <span class="marca-nombre">FastExpress</span>
  </header>

  <main class="mesa">
    <section class="cotizador" aria-labelledby="titulo">
      <h1 id="titulo">Cotiza tu envío</h1>
      <p class="intro">Ingresa los datos del paquete y obtén el valor con descuentos, recargos y seguro.</p>

      <form id="form-cotizacion" novalidate data-testid="form-cotizacion">
        <div class="campo">
          <label for="peso">Peso del paquete</label>
          <div class="entrada-unidad">
            <input id="peso" name="peso" type="text" inputmode="decimal" autocomplete="off"
                   placeholder="2.50" aria-describedby="peso-ayuda peso-error" data-testid="input-peso">
            <span class="unidad">kg</span>
          </div>
          <p id="peso-ayuda" class="ayuda">Hasta 20 kg, con máximo 2 decimales.</p>
          <p id="peso-error" class="error-campo" data-testid="error-peso" hidden></p>
        </div>

        <div class="campo">
          <label for="monto">Valor declarado del contenido</label>
          <div class="entrada-unidad">
            <span class="unidad unidad-inicio">$</span>
            <input id="monto" name="monto_declarado" type="text" inputmode="decimal" autocomplete="off"
                   placeholder="80.00" aria-describedby="monto-ayuda monto-error" data-testid="input-monto">
            <span class="unidad">USD</span>
          </div>
          <p id="monto-ayuda" class="ayuda">Hasta $1,000. Si supera $100 se cobra un seguro del 2 %.</p>
          <p id="monto-error" class="error-campo" data-testid="error-monto" hidden></p>
        </div>

        <fieldset class="campo">
          <legend>Tipo de cliente</legend>
          <div class="segmentos" data-testid="grupo-cliente">
            <label><input type="radio" name="tipo_cliente" value="NUEVO" checked><span>Nuevo<small>Sin descuento</small></span></label>
            <label><input type="radio" name="tipo_cliente" value="FRECUENTE"><span>Frecuente<small>10 % menos</small></span></label>
            <label><input type="radio" name="tipo_cliente" value="VIP"><span>VIP<small>20 % menos</small></span></label>
          </div>
        </fieldset>

        <fieldset class="campo">
          <legend>Tipo de envío</legend>
          <div class="segmentos" data-testid="grupo-envio">
            <label><input type="radio" name="tipo_envio" value="ESTANDAR" checked><span>Estándar<small>Sin recargo</small></span></label>
            <label><input type="radio" name="tipo_envio" value="EXPRESS"><span>Express<small>25 % adicional</small></span></label>
          </div>
        </fieldset>

        <button type="submit" class="boton" data-testid="boton-cotizar">Cotizar envío</button>
      </form>
    </section>

    <section class="resultado" aria-label="Resultado de la cotización">
      <div id="guia" class="guia guia-vacia" aria-live="polite" data-testid="guia">
        <p class="guia-vacia-texto">Tu guía de envío aparecerá aquí cuando cotices.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
